server:
  port: 8080

spring:
  datasource:
    # DB 접속 정보는 application-secret.yml에서 설정
    url: jdbc:mysql://127.0.0.1:3306/playball?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: playball_user
    password: 1234

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Swagger UI 활성화
springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

logging:
  level:
    com.playball: DEBUG
