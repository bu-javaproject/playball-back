server:
  port: 8080

spring:
  datasource:
    # DB 접속 정보는 application-secret.yml에서 설정
    url: jdbc:mysql://localhost:3306/playball?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: playball_user
    password: 1234

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.playball: DEBUG