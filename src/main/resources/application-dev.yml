server:
  port: 8080

spring:
  datasource:
    # DB 접속 정보는 application-secret.yml에서 설정
    url: jdbc:mysql://localhost:3306/playball?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver

# Swagger UI 활성화
springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

logging:
  level:
    com.playball: DEBUG
    org.mybatis: DEBUG
