spring:
  profiles:
    active: dev, secret    # dev + secret 프로필을 동시에 활성화
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

# JWT 토큰 만료 시간 (비밀키는 application-secret.yml에)
jwt:
  access-expiration: 1800000       # Access Token 30분
  refresh-expiration: 604800000    # Refresh Token 7일

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

# 카카오 OAuth URL (API 키는 application-secret.yml에)
kakao:
  token-uri: https://kauth.kakao.com/oauth/token
  user-info-uri: https://kapi.kakao.com/v2/user/me