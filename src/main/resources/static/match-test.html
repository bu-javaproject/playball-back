<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>실시간 매칭 테스트</title>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs/lib/stomp.min.js"></script>

    <style>
        body { font-family: Arial; margin: 30px; }
        .match-card { border: 1px solid #ccc; padding: 15px; margin-bottom: 10px; cursor: pointer; }
        .match-card:hover { background: #f5f5f5; }
        .participant { padding: 5px 0; }
        button { margin-top: 10px; padding: 10px; }
        #success { color: green; font-weight: bold; }
        #error { color: red; font-weight: bold; }
    </style>
</head>
<body>

<h1>경기 목록</h1>
<div id="match-list"></div>

<hr>

<h2>직접 조회 (목록 없이 테스트)</h2>
<input type="number" id="direct-match-id" placeholder="matchId 입력 (예: 1)" style="padding:8px; width:200px;">
<button onclick="loadMatchDetail(document.getElementById('direct-match-id').value)">조회</button>

<hr>

<h2>경기 상세</h2>
<div id="match-detail"></div>
<div id="participants"></div>
<button id="join-btn" style="display:none;">참가 신청</button>
<p id="success"></p>
<p id="error"></p>

<script>
    const API_BASE = "http://localhost:8080/api";
    const USER_ID = 1;

    let currentMatchId = null;
    let currentMatchData = null; // 상세 정보 보존용
    let stompClient = null;

    // =========================
    // 경기 목록 조회
    // =========================
    async function loadMatches() {
        try {
            const response = await axios.get(`${API_BASE}/matches`);
            const matches = response.data.data;

            const container = document.getElementById("match-list");
            container.innerHTML = "";

            if (!matches || matches.length === 0) {
                container.innerHTML = "<p>경기 데이터가 없습니다.</p>";
                return;
            }

            matches.forEach(match => {
                const div = document.createElement("div");
                div.className = "match-card";
                div.innerHTML = `
                    <h3>${match.title}</h3>
                    <p>종목: ${match.sportType}</p>
                    <p>장소: ${match.locationName}</p>
                    <p>인원: ${match.currentPlayers} / ${match.maxPlayers}</p>
                    <p>상태: ${match.status}</p>
                `;
                // 목록 API는 MatchResponse DTO → matchId 필드
                div.onclick = () => loadMatchDetail(match.matchId);
                container.appendChild(div);
            });
        } catch (e) {
            document.getElementById("error").innerText = "목록 조회 실패: " + e.message;
        }
    }

    // =========================
    // 경기 상세 조회
    // =========================
    async function loadMatchDetail(matchId) {
        try {
            currentMatchId = matchId;
            const response = await axios.get(`${API_BASE}/matches/${matchId}`);
            const data = response.data.data;

            // 상세 API는 MatchDetailResponse → match 필드가 Match 엔티티 (id 필드)
            const match = data.match;
            currentMatchData = match;

            renderMatchDetail(match);
            renderParticipants(data.joinedMembers);

            document.getElementById("join-btn").style.display = "block";
            document.getElementById("success").innerText = "";
            document.getElementById("error").innerText = "";

            connectWebSocket(matchId);
        } catch (e) {
            document.getElementById("error").innerText = "상세 조회 실패: " + e.message;
        }
    }

    // =========================
    // 경기 상세 렌더링
    // =========================
    function renderMatchDetail(match) {
        document.getElementById("match-detail").innerHTML = `
            <h3>${match.title}</h3>
            <p>종목: ${match.sportType}</p>
            <p>장소: ${match.locationName}</p>
            <p>인원: <span id="current-players">${match.currentPlayers}</span> / ${match.maxPlayers}</p>
            <p>상태: <span id="match-status">${match.status}</span></p>
        `;
    }

    // =========================
    // 참가자 렌더링
    // =========================
    function renderParticipants(participants) {
        const container = document.getElementById("participants");
        container.innerHTML = "<h3>참가자 목록</h3>";

        if (!participants || participants.length === 0) {
            container.innerHTML += "<p>참가자가 없습니다.</p>";
            return;
        }

        participants.forEach(member => {
            const div = document.createElement("div");
            div.className = "participant";
            // MemberInfo DTO: memberId, nickname, gender, age, skillLevel, preferredPosition
            div.innerText = `${member.nickname || "(닉네임 없음)"} (${member.gender || "-"}, ${member.age || "-"}세)`;
            container.appendChild(div);
        });
    }

    // =========================
    // 웹소켓 연결
    // =========================
    function connectWebSocket(matchId) {
        if (stompClient) stompClient.disconnect();

        const socket = new SockJS("http://localhost:8080/ws");
        stompClient = Stomp.over(socket);
        stompClient.debug = null; // 콘솔 노이즈 제거

        stompClient.connect({}, () => {
            console.log("웹소켓 연결 성공");
            stompClient.subscribe(`/topic/match/${matchId}`, (message) => {
                const response = JSON.parse(message.body);
                console.log("실시간 메시지:", response);
                handleRealtimeUpdate(response);
            });
        }, (error) => {
            console.error("웹소켓 연결 실패:", error);
        });
    }

    // =========================
    // 실시간 업데이트 처리
    // MatchedResponse: { matchId, currentPlayers, maxPlayers, status }
    // =========================
    function handleRealtimeUpdate(response) {
        const currentEl = document.getElementById("current-players");
        const statusEl = document.getElementById("match-status");

        if (currentEl) currentEl.innerText = response.currentPlayers;
        if (statusEl) statusEl.innerText = response.status;

        document.getElementById("success").innerText =
            `실시간 업데이트 완료! (현재 ${response.currentPlayers}/${response.maxPlayers}명)`;
    }

    // =========================
    // 참가 신청
    // =========================
    document.getElementById("join-btn").addEventListener("click", () => {
        if (!stompClient || !stompClient.connected) {
            alert("웹소켓 연결 안됨");
            return;
        }

        stompClient.send(
            `/app/match/${currentMatchId}/join`,
            {},
            JSON.stringify({ userId: USER_ID })
        );

        console.log("참가 요청 전송");
    });

    // 초기 로딩
    loadMatches();
</script>

</body>
</html>
