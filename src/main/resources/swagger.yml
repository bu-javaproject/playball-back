        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                messageType:
                  type: string
                  enum: [TEXT, IMAGE]
                  default: "TEXT"
            example:
              content: "안녕하세요!"
              messageType: "TEXT"
      responses:
        '201':
          description: 전송 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                success: true
                message: "전송 성공"
                data:
                  messageId: 101
                  content: "안녕하세요!"
                  messageType: "TEXT"
                  sentAt: "2026-04-26T18:05:00"

# ============================================================
# Components
# ============================================================
components:

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "카카오 로그인 후 발급받은 accessToken"

  schemas:

    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          nullable: true

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        data:
          nullable: true
          example: null

    SignUpCompleteRequest:
      type: object
      required: [nickname, gender, age, favoriteSports]
      properties:
        nickname:
          type: string
          minLength: 2
          maxLength: 10
          description: "닉네임 (2~10자)"
        gender:
          type: string
          enum: [M, F]
          description: "성별"
        age:
          type: integer
          description: "나이"
        address:
          type: string
          description: "지역"
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        favoriteSports:
          type: array
          items:
            type: string
          description: "즐겨하는 종목 (복수 선택)"
          example: ["SOCCER", "BASKETBALL", "RUNNING"]
        skillLevel:
          type: string
          enum: [BEGINNER, INTERMEDIATE, ADVANCED]
          description: "실력 수준"
        preferredPosition:
          type: string
          description: "선호 포지션"

    ProfileEditRequest:
      type: object
      description: 변경할 필드만 포함
      properties:
        nickname:
          type: string
        profileImage:
          type: string
        address:
          type: string
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        favoriteSports:
          type: array
          items:
            type: string
        skillLevel:
          type: string
          enum: [BEGINNER, INTERMEDIATE, ADVANCED]
        preferredPosition:
          type: string

    MatchCreateRequest:
      type: object
      required: [title, sportType, matchDate, latitude, longitude, maxPlayers]
      properties:
        title:
          type: string
          description: "경기 제목"
        sportType:
          type: string
          description: "종목"
        matchDate:
          type: string
          format: date-time
          description: "경기 날짜/시간"
        locationName:
          type: string
          description: "장소명"
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        address:
          type: string
        maxPlayers:
          type: integer
          description: "최대 인원"
        skillLevel:
          type: string
          enum: [BEGINNER, INTERMEDIATE, ADVANCED]
        entryFee:
          type: integer
          description: "참가비 (0이면 무료)"
          default: 0
        description:
          type: string
          description: "공지 메시지"

    MatchUpdateRequest:
      type: object
      description: 변경할 필드만 포함
      properties:
        title:
          type: string
        matchDate:
          type: string
          format: date-time
        maxPlayers:
          type: integer
        entryFee:
          type: integer
        description:
          type: string
          description: "공지 메시지"

    RandomMatchRequest:
      type: object
      required: [latitude, longitude, sportType]
      properties:
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        address:
          type: string
        date:
          type: string
          format: date
        sportType:
          type: string
        preferredPosition:
          type: string
        gender:
          type: string
          enum: [M, F]
        ageRange:
          type: integer
          description: "연령대"
        skillLevel:
          type: integer
          minimum: 1
          maximum: 5
          description: "실력 (별 1~5개)"
        maxFee:
          type: integer
          description: "최대 참가비"

  responses:
    Unauthorized:
      description: 인증 실패
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: "인증이 필요합니다"
            data: null
  
