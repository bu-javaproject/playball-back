  /api/matching/random:
    post:
      tags: [매칭]
      summary: 랜덤 매칭 요청
      description: |
        **플로우차트: 9. 랜덤 매칭**
        **와이어프레임: 랜덤 매칭 입력 화면**

        조건을 입력하면 시스템이 적합한 경기를 찾습니다.

        **입력 항목 (와이어프레임 순서):**
        1. 위치
        2. 날짜
        3. 종목
        4. 선호 포지션 및 역할 (예: ST)
        5. 성별 (혼성 경기 / 남성 경기 등)
        6. 나이대 (예: 21)
        7. 실력 (별점 5점 만점)
        8. 매칭 비용 (가격대)
        → "매칭" 버튼

        **결과 화면:**
        - 탐색 중: "주변 경기를 찾고 있어요" + 취소 버튼
        - 성공: "경기 발견" 화면 → 수락/거절 버튼
        - 실패: "조건에 맞는 경기가 없어요" → 조건 다시 설정 / 경기 직접 만들기
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RandomMatchRequest'
            example:
              latitude: 37.6394
              longitude: 127.0722
              address: "서울시 노원구 신부동"
              date: "2026-04-30"
              sportType: "SOCCER"
              preferredPosition: "ST"
              gender: "M"
              ageRange: 21
              skillLevel: 3
              maxFee: 10000
      responses:
        '200':
          description: 매칭 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              examples:
                found:
                  summary: 매칭 성공 → 경기 발견
                  value:
                    success: true
                    message: "매칭 성공"
                    data:
                      matched: true
                      match:
                        matchId: 3
                        title: "백석대 축구 내기"
                        sportType: "SOCCER"
                        matchDate: "2026-04-30T19:00:00"
                        locationName: "서울 목동운동장"
                        latitude: 37.5283
                        longitude: 126.8755
                        maxPlayers: 10
                        currentPlayers: 7
                        distance: 2.3
                        creatorNickname: "홍길동"
                notfound:
                  summary: 매칭 실패 → 조건에 맞는 경기 없음
                  value:
                    success: true
                    message: "조건에 맞는 경기가 없어요"
                    data:
                      matched: false
                      match: null

  /api/matching/random/accept:
    post:
      tags: [매칭]
      summary: 랜덤 매칭 수락
      description: |
        **와이어프레임: 경기 발견 화면 → "수락" 버튼**
        랜덤 매칭으로 찾은 경기에 참가합니다.
      requestBody:
