              examples:
                notFound:
                  value: { success: false, message: "존재하지 않는 경기입니다.", data: null }
                deleted:
                  value: { success: false, message: "이미 삭제된 경기입니다.", data: null }

    patch:
      tags: [경기]
      summary: 경기 수정 (주최자 전용)
      description: |
        변경할 필드만 포함하면 됩니다.
        - `maxPlayers`: 현재 참가 인원(`currentPlayers`)보다 작게 설정 불가
        - `matchDate`: 현재 시각 이후여야 합니다
        삭제된 경기는 수정 불가합니다.
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatchUpdateRequest'
            example:
              title: "백석대 컴공 축구 내기 (인원 추가)"
              matchDate: "2026-05-30T19:00:00"
              maxPlayers: 12
              description: "인원 늘렸습니다!"
              entryFee: 0
