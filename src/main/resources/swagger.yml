openapi: 3.0.3
info:
  title: PlayBall API
  description: |
    **PlayBall** - 스포츠 매칭 플랫폼 REST API 명세서

    ## 인증 방식
    카카오 OAuth 로그인 후 서버에서 JWT를 발급합니다.
    - `POST /api/auth/kakao` → 카카오 인가코드로 로그인 → accessToken + refreshToken 발급
    - 인증 필요 API: `Authorization: Bearer {accessToken}` 헤더 포함
    - 비로그인 허용 API: `security: []` 표기

    ## 공통 응답
    ```json
    { "success": true, "message": "성공", "data": { ... } }
    ```

    ## 에러 응답
    ```json
    { "success": false, "message": "에러 메시지", "data": null }
    ```

    ## 종목 코드
    `SOCCER` | `BASKETBALL` | `RUNNING` | `BADMINTON`

    ## 실력 코드
    `BEGINNER` | `INTERMEDIATE` | `ADVANCED`
  version: 1.1.0
  contact:
    name: PlayBall Team

servers:
  - url: http://localhost:8080
    description: 로컬 개발
  - url: https://api.playball.kr
    description: 운영

tags:
  - name: 인증
    description: 카카오 로그인 / 토큰 재발급 / 로그아웃
  - name: 회원
    description: 회원가입(추가정보) / 프로필 조회·수정 / 위치 / 탈퇴
  - name: 경기
    description: 경기 생성 / 목록 / 상세 / 수정 / 삭제 / 내 경기
  - name: 매칭
    description: 경기 참가·취소 / 랜덤 매칭
  - name: 알림
    description: 알림 목록 / 읽음 처리 / 설정 / FCM 토큰
  - name: 칭찬
    description: 경기 후 칭찬 등록 / 조회 / 누적 통계

security:
  - BearerAuth: []

# ============================================================
paths:

  # ──────────────────────────────────────────────
  # 인증
  # ──────────────────────────────────────────────

  /api/auth/kakao:
    post:
      tags: [인증]
      summary: 카카오 로그인
      description: |
        카카오 인가코드를 전달하면 JWT 토큰을 발급합니다.
        - 기존 회원: `isNewUser: false` → 바로 사용
        - 신규 회원: `isNewUser: true` → `POST /api/members/signup/complete` 호출 필요
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [authorizationCode]
              properties:
                authorizationCode:
                  type: string
            example:
              authorizationCode: "ABCDEF123456"
      responses:
        '200':
          description: 로그인 성공 (신규/기존 회원 모두 200. isNewUser로 구분)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              examples:
                existingUser:
                  summary: 기존 회원
                  value:
                    success: true
                    message: "로그인 성공"
                    data:
                      accessToken: "eyJhbGciOiJIUzI1NiJ9..."
                      refreshToken: "dGhpcyBpcyByZWZyZXNo..."
                      tokenType: "Bearer"
                      isNewUser: false
                      member:
                        memberId: 1
                        nickname: "홍길동"
                        profileImage: "https://k.kakaocdn.net/..."
                        role: "USER"
                newUser:
                  summary: 신규 회원 (추가정보 입력 필요)
                  value:
                    success: true
                    message: "추가 정보 입력이 필요합니다"
                    data:
                      accessToken: "eyJhbGciOiJIUzI1NiJ9..."
                      refreshToken: "dGhpcyBpcyByZWZyZXNo..."
                      tokenType: "Bearer"
                      isNewUser: true
                      member:
                        memberId: 2
                        nickname: null
                        profileImage: "https://k.kakaocdn.net/..."
                        role: "USER"
        '401':
          description: 카카오 인증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "카카오 인증에 실패했습니다."
                data: null

  /api/auth/refresh:
    post:
      tags: [인증]
      summary: 토큰 재발급
      description: Refresh Token으로 새 Access Token + Refresh Token을 발급받습니다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
            example:
              refreshToken: "dGhpcyBpcyByZWZyZXNo..."
      responses:
        '200':
          description: 재발급 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                success: true
                message: "토큰 재발급 성공"
                data:
                  accessToken: "eyJhbGciOiJIUzI1NiJ9.new..."
                  refreshToken: "bmV3IHJlZnJlc2g..."
                  tokenType: "Bearer"
                  isNewUser: false
        '401':
          description: 만료되었거나 유효하지 않은 Refresh Token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid:
                  value: { success: false, message: "유효하지 않은 토큰입니다.", data: null }
                expired:
                  value: { success: false, message: "만료된 토큰입니다.", data: null }

  /api/auth/logout:
    post:
      tags: [인증]
      summary: 로그아웃
      description: 서버에 저장된 Refresh Token을 삭제합니다.
      responses:
        '200':
          description: 로그아웃 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                success: true
                message: "로그아웃 성공"
                data: null
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ──────────────────────────────────────────────
  # 회원
  # ──────────────────────────────────────────────

  /api/members/signup/complete:
    post:
      tags: [회원]
      summary: 회원가입 추가정보 입력
      description: |
        카카오 로그인 후 신규 회원(`isNewUser: true`)이 추가 정보를 입력합니다.
        이미 완료된 계정에서 재호출하면 409 에러를 반환합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpCompleteRequest'
            example:
              nickname: "홍길동"
              gender: "M"
              age: 22
              address: "서울시 노원구 신부동"
              latitude: 37.6394
              longitude: 127.0722
              favoriteSports: ["SOCCER", "BASKETBALL"]
              skillLevel: "INTERMEDIATE"
              preferredPosition: "ST"
      responses:
        '200':
          description: 가입 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                success: true
                message: "회원가입이 완료되었습니다"
                data:
                  memberId: 2
                  nickname: "홍길동"
                  email: "hong@kakao.com"
                  gender: "M"
                  age: 22
                  address: "서울시 노원구 신부동"
                  favoriteSports: ["SOCCER", "BASKETBALL"]
                  skillLevel: "INTERMEDIATE"
                  preferredPosition: "ST"
                  role: "USER"
                  signupCompleted: true
        '409':
          description: 닉네임 중복 또는 이미 가입 완료된 계정
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                nicknameDuplicate:
                  summary: 닉네임 중복
                  value: { success: false, message: "이미 사용 중인 닉네임입니다.", data: null }
                alreadyCompleted:
                  summary: 이미 가입 완료
                  value: { success: false, message: "이미 회원가입이 완료된 계정입니다.", data: null }

  /api/members/check-nickname:
    get:
      tags: [회원]
      summary: 닉네임 중복 확인
      description: 비로그인 상태에서도 사용 가능합니다.
      security: []
      parameters:
        - name: nickname
          in: query
          required: true
          schema:
            type: string
          example: "홍길동"
      responses:
        '200':
          description: 확인 완료 (사용 가능 여부는 data.available 참고)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              examples:
                available:
                  summary: 사용 가능
                  value: { success: true, message: "사용 가능한 닉네임입니다", data: { available: true } }
                duplicate:
                  summary: 중복
                  value: { success: true, message: "이미 사용 중인 닉네임입니다", data: { available: false } }

  /api/members/me:
    get:
      tags: [회원]
      summary: 내 프로필 조회
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                success: true
                message: "프로필 조회 성공"
                data:
                  memberId: 1
                  nickname: "홍길동"
                  profileImage: "https://k.kakaocdn.net/..."
                  gender: "M"
                  age: 22
                  address: "서울시 노원구 신부동"
                  skillLevel: "INTERMEDIATE"
                  preferredPosition: "ST"
                  favoriteSports: ["SOCCER", "BASKETBALL"]
        '401':
          $ref: '#/components/responses/Unauthorized'

    patch:
      tags: [회원]
      summary: 내 프로필 수정
      description: |
        변경할 필드만 포함하면 됩니다. null 전달 시 해당 필드는 변경되지 않습니다.
        - `nickname`: null이면 유지, 빈 문자열("")은 검증 실패(2자 미만)
        - `favoriteSports`: null이면 유지, 빈 배열([])이면 전체 삭제
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
            example:
              nickname: "새닉네임"
              address: "서울시 강남구"
              latitude: 37.5665
              longitude: 126.9780
              favoriteSports: ["SOCCER", "BADMINTON"]
      responses:
        '200':
          description: 수정 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                success: true
                message: "프로필이 수정되었습니다"
                data:
                  memberId: 1
                  nickname: "새닉네임"
                  profileImage: "https://k.kakaocdn.net/..."
                  gender: "M"
                  age: 22
                  address: "서울시 강남구"
                  skillLevel: "INTERMEDIATE"
                  preferredPosition: "ST"
                  favoriteSports: ["SOCCER", "BADMINTON"]
        '409':
          description: 닉네임 중복
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example: { success: false, message: "이미 사용 중인 닉네임입니다.", data: null }

  /api/members/me/location:
    patch:
      tags: [회원]
      summary: 현재 위치 업데이트
      description: 지역 매칭 시 사용할 현재 위치를 갱신합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [latitude, longitude]
              properties:
                latitude:
                  type: number
                  format: double
                longitude:
                  type: number
                  format: double
                address:
                  type: string
            example:
              latitude: 37.6394
              longitude: 127.0722
              address: "서울시 노원구 신부동"
      responses:
        '200':
          description: 업데이트 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                success: true
                message: "위치가 업데이트되었습니다"
                data: null

  /api/members/me/matches:
    get:
      tags: [회원]
      summary: 내가 참가한 경기 목록 조회
      description: |
        내가 APPROVED 상태로 참가한 경기 목록을 경기일 역순으로 반환합니다.
        DELETED 상태인 경기는 제외됩니다.
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                success: true
                message: "내 경기 목록 조회 성공"
                data:
                  - matchId: 5
                    title: "백석대 축구 내기"
                    sportType: "SOCCER"
                    matchDate: "2026-05-30T19:00:00"
                    locationName: "백석대 중앙운동장"
                    latitude: 37.6400
                    longitude: 127.0730
                    maxPlayers: 10
                    currentPlayers: 7
                    gender: null
                    ageRange: null
                    status: "OPEN"
                    updatedAt: "2026-05-17T10:00:00"
                  - matchId: 3
                    title: "농구 3:3"
                    sportType: "BASKETBALL"
                    matchDate: "2026-05-20T18:00:00"
                    locationName: "신부동 공원"
                    latitude: 37.6380
                    longitude: 127.0710
                    maxPlayers: 6
                    currentPlayers: 6
                    gender: "M"
                    ageRange: 20
                    status: "CLOSED"
                    updatedAt: "2026-05-15T09:00:00"
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/members/withdraw:
    delete:
      tags: [회원]
      summary: 회원 탈퇴
      description: 계정을 영구 삭제합니다.
      responses:
        '200':
          description: 탈퇴 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                success: true
                message: "회원 탈퇴가 완료되었습니다"
                data: null

  /api/members/{memberId}:
    get:
      tags: [회원]
      summary: 다른 회원 프로필 조회
      description: 민감 정보(kakaoId, email, name, phone, role, signupCompleted)는 제외됩니다.
      parameters:
        - name: memberId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                success: true
                message: "회원 조회 성공"
                data:
                  memberId: 3
                  nickname: "김철수"
                  profileImage: null
                  gender: "M"
                  age: 28
                  address: "수원"
                  skillLevel: "ADVANCED"
                  preferredPosition: "GK"
                  favoriteSports: ["SOCCER"]
        '404':
          description: 존재하지 않는 회원
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example: { success: false, message: "존재하지 않는 유저입니다.", data: null }

  # ──────────────────────────────────────────────
  # 경기
  # ──────────────────────────────────────────────

  /api/matches:
    get:
      tags: [경기]
      summary: 경기 목록 조회
      description: |
        **위치 기반 조회 (latitude + longitude 제공 시)**
        - Haversine 공식으로 반경(radius km) 내 OPEN 경기를 거리순 반환
        - sportType 필터 적용 가능

        **일반 목록 조회 (위치 미제공 시)**
        - DELETED 제외한 전체 경기를 최신순, 페이지네이션으로 반환
      security: []
      parameters:
        - name: latitude
          in: query
          description: 검색 기준 위도 (longitude와 함께 제공 시 위치 기반 모드)
          schema:
            type: number
            format: double
          example: 37.6394
        - name: longitude
          in: query
          description: 검색 기준 경도
          schema:
            type: number
            format: double
          example: 127.0722
        - name: radius
          in: query
          description: 검색 반경 km (기본값 5.0, 위치 기반 모드에서만 사용)
          schema:
            type: number
            format: double
            default: 5.0
        - name: sportType
          in: query
          description: "종목 필터 (SOCCER | BASKETBALL | RUNNING | BADMINTON). 생략 시 전체"
          schema:
            type: string
        - name: page
          in: query
          description: 페이지 번호 (일반 목록 모드에서만 사용, 0부터 시작)
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          description: 페이지 크기 (일반 목록 모드에서만 사용)
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              examples:
                locationBased:
                  summary: 위치 기반 (거리순)
                  value:
                    success: true
                    message: "경기 목록 조회 성공"
                    data:
                      - matchId: 2
                        title: "백석대 버스정류장 옆 농구"
                        sportType: "BASKETBALL"
                        matchDate: "2026-05-30T19:00:00"
                        locationName: "백석대 버스정류장 옆"
                        latitude: 37.6380
                        longitude: 127.0710
                        maxPlayers: 10
                        currentPlayers: 9
                        gender: null
                        ageRange: null
                        status: "OPEN"
                        updatedAt: null
                      - matchId: 1
                        title: "백석대 중앙운동장 축구"
                        sportType: "SOCCER"
                        matchDate: "2026-05-30T20:00:00"
                        locationName: "백석대 중앙운동장"
                        latitude: 37.6400
                        longitude: 127.0730
                        maxPlayers: 10
                        currentPlayers: 7
                        gender: "M"
                        ageRange: 20
                        status: "OPEN"
                        updatedAt: null
                paged:
                  summary: 일반 목록 (페이지네이션)
                  value:
                    success: true
                    message: "경기 목록 조회 성공"
                    data:
                      - matchId: 5
                        title: "강남 풋살"
                        sportType: "SOCCER"
                        matchDate: "2026-06-01T18:00:00"
                        locationName: "강남 풋살장"
                        latitude: 37.5172
                        longitude: 127.0473
                        maxPlayers: 10
                        currentPlayers: 3
                        gender: null
                        ageRange: null
                        status: "OPEN"
                        updatedAt: "2026-05-17T08:00:00"

    post:
      tags: [경기]
      summary: 경기 생성
      description: |
        경기를 생성합니다. 생성자는 자동으로 APPROVED 상태로 첫 번째 참가자가 됩니다.
        - `sportType`: `SOCCER` | `BASKETBALL` | `RUNNING` | `BADMINTON`
        - `skillLevel`: `BEGINNER` | `INTERMEDIATE` | `ADVANCED`
        - `matchDate`: 현재 시각 이후여야 합니다(`@FutureOrPresent`)
        - `entryFee`: 생략 또는 null 시 0으로 처리
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatchCreateRequest'
            example:
              title: "백석대 컴공 축구 내기"
              sportType: "SOCCER"
              matchDate: "2026-05-30T19:00:00"
              locationName: "서울 목동운동장"
              latitude: 37.5283
              longitude: 126.8755
              address: "서울시 양천구 목동"
              maxPlayers: 10
              gender: "M"
              ageRange: 20
              skillLevel: "INTERMEDIATE"
              entryFee: 0
              description: "백석대 근처 축구하실 분 구합니다!"
      responses:
        '200':
          description: 경기 생성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                success: true
                message: "경기 생성 성공"
                data:
