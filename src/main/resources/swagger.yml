  # 알림
  # ──────────────────────────────────────────────

  /api/notifications:
    get:
      tags: [알림]
      summary: 내 알림 목록 조회 (Cursor 페이지네이션)
      description: |
        무한 스크롤 형태. 첫 호출은 cursor 생략, 응답의 `nextCursor`를 다음 호출에 전달.
        `nextCursor`가 null이면 더 이상 데이터가 없습니다.

        **알림 타입 (noticeType):**
        - `MATCH_FOUND`: 매칭 성사 / 참가 수락
        - `APPLICATION_REJECTED`: 참가 거절
        - `MATCH_REMINDER`: 경기 시작 1시간 전 리마인더
        - `MATCH_CANCELLED`: 경기 취소
        - `RATING_REQUEST`: 경기 종료 후 칭찬 요청
        - `SYSTEM_NOTICE`: 시스템 공지
      parameters:
        - name: cursor
          in: query
          description: 이전 응답의 nextCursor 값 (첫 호출 시 생략)
          schema:
            type: integer
            format: int64
        - name: size
          in: query
          schema:
            type: integer
            default: 20
        - name: onlyUnread
          in: query
          description: true이면 안 읽은 알림만 조회
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                success: true
                message: "알림 목록 조회 성공"
                data:
                  items:
                    - notificationId: 145
                      noticeType: "MATCH_FOUND"
                      title: "매칭 성사!"
                      content: "백석대 컴공 내기 매칭이 성사되었습니다."
                      isRead: false
                      targetType: "MATCH"
                      targetId: 12
                      createdAt: "2026-05-17T19:00:00"
                    - notificationId: 144
                      noticeType: "MATCH_REMINDER"
                      title: "경기 임박"
                      content: "오후 7시 '백석대 축구' 경기가 곧 시작됩니다."
                      isRead: true
                      targetType: "MATCH"
                      targetId: 1
                      createdAt: "2026-05-17T18:00:00"
                  nextCursor: 144

  /api/notifications/unread-count:
    get:
      tags: [알림]
      summary: 안 읽은 알림 개수 조회
      description: 앱 탭바 배지에 표시할 미읽음 알림 수를 조회합니다.
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                success: true
                message: "안 읽은 알림 개수 조회 성공"
                data:
                  count: 3

