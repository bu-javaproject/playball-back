openapi: 3.0.3
info:
  title: PlayBall API
  description: |
    **PlayBall** - 스포츠 매칭 플랫폼 REST API 명세서

    ## 인증 방식
    카카오 OAuth 로그인 후 서버에서 JWT를 발급합니다.
    - `POST /api/auth/kakao` → 카카오 인가코드로 로그인 → accessToken + refreshToken 발급
    - 인증 필요 API: `Authorization: Bearer {accessToken}` 헤더 포함
    - 비로그인 허용 API: `security: []` 표기 (지도 검색, 경기 상세 조회)

    ## 공통 응답
    ```json
    {
      "success": true,
      "message": "성공",
      "data": { ... }
    }
    ```

    ## 에러 응답
    ```json
    {
      "success": false,
      "message": "에러 메시지",
      "data": null
    }
    ```
  version: 1.0.0
  contact:
    name: PlayBall Team

servers:
  - url: http://localhost:8080
    description: 로컬 개발
  - url: https://api.playball.kr
    description: 운영

tags:
  - name: 인증
    description: 카카오 로그인 / 토큰 재발급 / 로그아웃
  - name: 회원
    description: 회원가입(추가정보) / 프로필 조회·수정 / 탈퇴
  - name: 경기
    description: 경기 생성 / 조회 / 수정 / 삭제 / 내 경기
  - name: 참가자
    description: 참가 신청 / 수락 / 거절 / 내보내기 / 참가 취소
  - name: 매칭
    description: 지역 매칭(지도 검색) / 랜덤 매칭
  - name: 알림
    description: 알림 목록 / 읽음 처리 / 알림 설정
  - name: 친구
    description: 친구 요청 / 수락 / 거절 / 삭제
  - name: 채팅
    description: 채팅방 목록 / 메시지 조회 / 메시지 전송(REST 폴백)
  - name: 평가
    description: 경기 후 별점 평가

security:
  - BearerAuth: []

# ============================================================
paths:

  # ──────────────────────────────────────────────
  # 인증
  # ──────────────────────────────────────────────

  /api/auth/kakao:
    post:
      tags: [인증]
      summary: 카카오 로그인
      description: |
        카카오 인가코드를 전달하면 서버에서 카카오 API를 호출하여 사용자 정보를 가져오고,
        JWT 토큰을 발급합니다.

        **플로우차트: 1. 로그인**
        1. 메인 화면 → 로그인 페이지 → "카카오로 시작하기" 클릭
        2. 카카오 인증 후 인가코드를 서버에 전달
        3. 기존 회원 → 토큰 발급 (isNewUser: false)
        4. 신규 회원 → 카카오 기본 정보로 임시 가입 후 토큰 발급 (isNewUser: true)
           → 클라이언트에서 추가정보 입력 화면으로 이동
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [authorizationCode]
              properties:
                authorizationCode:
                  type: string
                  description: 카카오 인가코드
            example:
              authorizationCode: "ABCDEF123456"
      responses:
        '200':
          description: 로그인 성공 (기존 회원 / 신규 회원 모두 200 반환. isNewUser로 구분)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              examples:
                existingUser:
                  summary: 기존 회원 → 로그인 성공
                  value:
                    success: true
                    message: "로그인 성공"
                    data:
                      accessToken: "eyJhbGciOiJIUzI1NiJ9..."
                      refreshToken: "dGhpcyBpcyByZWZyZXNo..."
                      tokenType: "Bearer"
                      isNewUser: false
                      member:
                        memberId: 1
                        nickname: "홍길동"
                        profileImage: "https://k.kakaocdn.net/..."
                        role: "USER"
                newUser:
                  summary: 신규 회원 → 추가정보 입력 필요
                  value:
                    success: true
                    message: "추가 정보 입력이 필요합니다"
                    data:
                      accessToken: "eyJhbGciOiJIUzI1NiJ9..."
                      refreshToken: "dGhpcyBpcyByZWZyZXNo..."
                      tokenType: "Bearer"
                      isNewUser: true
                      member:
                        memberId: 2
                        nickname: null
                        profileImage: "https://k.kakaocdn.net/..."
                        role: "USER"

  /api/auth/refresh:
    post:
      tags: [인증]
      summary: 토큰 재발급
      description: Refresh Token으로 새 Access Token을 발급받습니다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
            example:
              refreshToken: "dGhpcyBpcyByZWZyZXNo..."
      responses:
        '200':
          description: 재발급 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                success: true
                message: "토큰 재발급 성공"
                data:
                  accessToken: "eyJhbGciOiJIUzI1NiJ9.new..."
                  refreshToken: "bmV3IHJlZnJlc2g..."
                  tokenType: "Bearer"
        '401':
          description: 만료되었거나 유효하지 않은 Refresh Token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "유효하지 않은 토큰입니다"
                data: null

  /api/auth/logout:
    post:
      tags: [인증]
      summary: 로그아웃
      description: |
        **플로우차트: 3. 로그아웃**
        프로필 화면 → 로그아웃 클릭 → 서버의 Refresh Token 삭제 → 메인 화면 이동
      responses:
        '200':
          description: 로그아웃 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                success: true
                message: "로그아웃 성공"
                data: null

  # ──────────────────────────────────────────────
  # 회원
  # ──────────────────────────────────────────────

  /api/members/signup/complete:
    post:
      tags: [회원]
      summary: 회원가입 추가정보 입력
      description: |
        **플로우차트: 2. 회원가입**
        카카오 로그인 후 신규 회원(isNewUser: true)이 추가 정보를 입력합니다.

        **입력 단계 (와이어프레임 기준):**
        1. 닉네임 입력 + 중복 확인
        2. 성별, 나이
        3. 지역(주소)
        4. 선호 종목 (복수 선택: 축구, 농구, 달리기, 배드민턴 등)
        5. 실력 수준
        6. 선호 포지션
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpCompleteRequest'
            example:
              nickname: "홍길동"
              gender: "M"
              age: 22
              address: "서울시 노원구 신부동"
              latitude: 37.6394
              longitude: 127.0722
              favoriteSports:
                - "SOCCER"
                - "BASKETBALL"
                - "RUNNING"
              skillLevel: "INTERMEDIATE"
              preferredPosition: "ST"
      responses:
        '200':
          description: 가입 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                success: true
                message: "회원가입이 완료되었습니다"
                data:
                  memberId: 2
                  nickname: "홍길동"
                  profileImage: "https://k.kakaocdn.net/..."
                  gender: "M"
                  age: 22
                  address: "서울시 노원구 신부동"
                  favoriteSports: ["SOCCER", "BASKETBALL", "RUNNING"]
                  skillLevel: "INTERMEDIATE"
                  preferredPosition: "ST"
                  role: "USER"
                  createdAt: "2026-04-26T10:00:00"
        '409':
          description: 닉네임 중복
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "이미 사용 중인 닉네임입니다"
                data: null

  /api/members/check-nickname:
    get:
      tags: [회원]
      summary: 닉네임 중복 확인
      description: 회원가입 시 닉네임 입력 후 실시간 중복 확인에 사용합니다.
      security: []
      parameters:
        - name: nickname
          in: query
          required: true
          schema:
            type: string
          example: "홍길동"
      responses:
        '200':
          description: 확인 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              examples:
                available:
                  summary: 사용 가능
                  value:
                    success: true
                    message: "사용 가능한 닉네임입니다"
                    data:
                      available: true
                duplicate:
                  summary: 중복
                  value:
                    success: true
                    message: "이미 사용 중인 닉네임입니다"
                    data:
                      available: false

  /api/members/me:
    get:
      tags: [회원]
      summary: 내 프로필 조회
      description: |
        **와이어프레임: 프로필(로그인)**
        프로필 화면에 표시되는 모든 정보를 반환합니다.
        - 기본 정보: 프로필 사진, 닉네임, 등급, 나이, 지역, 가입 기간
        - 통계: 참가 수, 주최 수, 출석률
        - 즐겨하는 종목 (복수)
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                success: true
                message: "성공"
                data:
                  memberId: 1
                  nickname: "홍길동"
                  profileImage: "https://k.kakaocdn.net/..."
                  gender: "M"
                  age: 22
                  address: "서울시 노원구 신부동"
                  grade: "중급"
                  memberSince: "3개월"
                  favoriteSports: ["SOCCER", "BASKETBALL", "RUNNING"]
                  skillLevel: "INTERMEDIATE"
                  preferredPosition: "ST"
                  stats:
                    participationCount: 23
                    hostCount: 5
                    attendanceRate: 98
                  createdAt: "2026-01-26T10:00:00"
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/members/me/edit:
    put:
      tags: [회원]
      summary: 프로필 수정
      description: |
        **와이어프레임: 프로필 편집**
        수정 가능 항목: 프로필 사진, 닉네임, 지역, 즐겨하는 종목, 실력, 포지션
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileEditRequest'
            example:
              nickname: "새닉네임"
              profileImage: "https://cdn.playball.kr/profiles/1.jpg"
              address: "서울시 강남구"
              latitude: 37.5665
              longitude: 126.9780
              favoriteSports: ["SOCCER", "BADMINTON"]
              skillLevel: "ADVANCED"
              preferredPosition: "MF"
      responses:
        '200':
          description: 수정 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                success: true
                message: "프로필이 수정되었습니다"
                data:
                  memberId: 1
                  nickname: "새닉네임"
                  profileImage: "https://cdn.playball.kr/profiles/1.jpg"
                  gender: "M"
                  age: 22
                  address: "서울시 강남구"
                  favoriteSports: ["SOCCER", "BADMINTON"]
                  skillLevel: "ADVANCED"
                  preferredPosition: "MF"
        '409':
          description: 닉네임 중복
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/members/{memberId}:
    get:
      tags: [회원]
      summary: 다른 회원 프로필 조회
      description: |
        **와이어프레임: 다른 유저 프로필**
        사진, 이름, 나이, 지역, 성별, 추천 수, 주 종목, 실력을 표시합니다.
      parameters:
        - name: memberId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                success: true
                message: "성공"
                data:
                  memberId: 3
                  nickname: "김철수"
                  profileImage: null
                  gender: "M"
                  age: 45
                  address: "수원"
                  favoriteSports: ["SOCCER"]
                  skillLevel: "ADVANCED"
                  recommendCount: 5
        '404':
          description: 존재하지 않는 회원
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "존재하지 않는 회원입니다"
                data: null

  /api/members/me/location:
    patch:
      tags: [회원]
      summary: 현재 위치 업데이트
      description: 지역 매칭 시 사용할 현재 위치를 업데이트합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [latitude, longitude]
              properties:
                latitude:
                  type: number
                  format: double
                longitude:
                  type: number
                  format: double
                address:
                  type: string
            example:
              latitude: 37.6394
              longitude: 127.0722
              address: "서울시 노원구 신부동"
      responses:
        '200':
          description: 업데이트 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                success: true
                message: "위치가 업데이트되었습니다"
                data: null

  /api/members/withdraw:
    delete:
      tags: [회원]
      summary: 회원 탈퇴
      description: 계정을 삭제합니다. 관련 데이터(경기, 채팅 등)도 함께 삭제됩니다.
      responses:
        '200':
          description: 탈퇴 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                success: true
                message: "회원 탈퇴가 완료되었습니다"
                data: null

  /api/members/me/history:
    get:
      tags: [회원]
      summary: 경기 기록 조회
      description: |
        **와이어프레임: 프로필 → 경기 기록**
        지금까지 참가했던 경기 이력을 조회합니다.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                success: true
                message: "성공"
                data:
                  content:
                    - matchId: 5
                      title: "백석대 축구"
                      sportType: "SOCCER"
                      matchDate: "2026-04-20T19:00:00"
                      locationName: "백석대 운동장"
                      result: "COMPLETED"
                      myRole: "PLAYER"
                      rated: true
                    - matchId: 3
                      title: "농구 3:3"
                      sportType: "BASKETBALL"
                      matchDate: "2026-04-15T18:00:00"
                      locationName: "신부동 공원"
                      result: "COMPLETED"
                      myRole: "PLAYER"
                      rated: false
                  totalElements: 23
                  totalPages: 2
                  hasNext: true

  # ──────────────────────────────────────────────
  # 경기
  # ──────────────────────────────────────────────

  /api/matches:
    post:
      tags: [경기]
      summary: 경기 생성
      description: |
        **플로우차트: 4. 경기 생성**
        1. 내 경기 화면 → (+) 버튼
        2. 경기 정보 입력: 제목, 종목, 날짜/시간, 장소, 최대 인원, 실력, 참가비 등
        3. 생성 완료 → 생성자가 자동으로 첫 번째 참가자로 등록

        **와이어프레임: 경기 수정(주최자 전용) 화면의 필드 기준**
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatchCreateRequest'
            example:
              title: "백석대 컴공 축구 내기 할 사람"
              sportType: "SOCCER"
              matchDate: "2026-04-30T19:00:00"
              locationName: "서울 목동운동장"
              latitude: 37.5283
              longitude: 126.8755
              address: "서울시 양천구 목동"
              maxPlayers: 10
              skillLevel: "INTERMEDIATE"
              entryFee: 0
              description: "백석대 근처 축구하실 분 구합니다!"
      responses:
        '201':
          description: 경기 생성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                success: true
                message: "경기가 생성되었습니다"
                data:
                  matchId: 1
                  creatorId: 1
                  creatorNickname: "홍길동"
                  title: "백석대 컴공 축구 내기 할 사람"
                  sportType: "SOCCER"
                  matchDate: "2026-04-30T19:00:00"
                  locationName: "서울 목동운동장"
                  latitude: 37.5283
                  longitude: 126.8755
                  address: "서울시 양천구 목동"
                  maxPlayers: 10
                  currentPlayers: 1
                  skillLevel: "INTERMEDIATE"
                  entryFee: 0
                  description: "백석대 근처 축구하실 분 구합니다!"
                  status: "OPEN"
                  createdAt: "2026-04-26T12:00:00"
        '400':
          description: 필수 항목 누락
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/matches/{matchId}:
    get:
      tags: [경기]
      summary: 경기 상세 조회
      description: |
        **와이어프레임: 참여 신청 화면**
        경기장 위치 미니맵, 종목 태그, 제목, 거리(백석대 운동장 200m),
        일시, 인원(7/10명), 실력(초급|중급), 참가비(무료),
        참가자 아바타 목록을 표시합니다.

        비로그인 사용자도 조회 가능합니다.
      security: []
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                success: true
                message: "성공"
                data:
                  matchId: 1
                  creatorId: 1
                  creatorNickname: "홍길동"
