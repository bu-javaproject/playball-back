  # ──────────────────────────────────────────────
  # 칭찬
  # ──────────────────────────────────────────────

  /api/matches/{matchId}/compliments:
    post:
      tags: [칭찬]
      summary: 경기 후 칭찬 Bulk 등록
      description: |
        경기 종료 후 같이 뛴 참가자들을 한 번에 칭찬합니다.

        **칭찬 태그:**
        `MANNERS`(매너 좋아요) | `SKILL`(실력 좋아요) | `PUNCTUAL`(시간 약속 잘 지켜요) |
        `PASSIONATE`(열정적이에요) | `MOOD_MAKER`(분위기 메이커)

        **검증 규칙:**
        - 호출자(rater)가 해당 경기의 APPROVED 참가자여야 함 → 아니면 403
        - 각 ratee도 해당 경기의 APPROVED 참가자여야 함 → 아니면 403
        - 자기 자신 칭찬 불가 → 400
        - 같은 batch 내 rateeId 중복 불가 → 400
        - 이미 해당 경기에서 그 대상을 칭찬했으면 409

        **트랜잭션:** 1명이라도 실패하면 전체 롤백
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComplimentBulkRequest'
            example:
              compliments:
                - rateeId: 5
                  tags: ["MANNERS", "PUNCTUAL"]
                  comment: "오늘 정말 즐거웠습니다"
                - rateeId: 7
                  tags: ["SKILL"]
                  comment: null
      responses:
        '200':
          description: 칭찬 등록 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                success: true
                message: "2명에게 칭찬을 보냈습니다"
                data:
                  created: 2
        '400':
          description: 자기 자신 칭찬 또는 중복 rateeId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                selfCompliment:
                  value: { success: false, message: "자기 자신은 칭찬할 수 없습니다.", data: null }
                duplicate:
                  value: { success: false, message: "이미 칭찬한 참가자가 포함되어 있습니다.", data: null }
        '403':
          description: 경기 참가자가 아님 (rater 또는 ratee)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example: { success: false, message: "경기에 참가하지 않은 회원입니다.", data: null }

  /api/members/{memberId}/compliments:
    get:
      tags: [칭찬]
      summary: 특정 회원이 받은 칭찬 목록 (Cursor 페이지네이션)
      parameters:
        - name: memberId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: cursor
          in: query
          schema:
            type: integer
            format: int64
        - name: size
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                success: true
                message: "칭찬 목록 조회 성공"
                data:
                  items:
                    - complimentId: 88
                      matchId: 12
                      raterId: 3
                      rateeId: 1
                      tags: ["MANNERS", "PUNCTUAL"]
                      comment: "오늘 정말 즐거웠습니다"
                      createdAt: "2026-05-17T19:30:00"
                    - complimentId: 87
                      matchId: 10
                      raterId: 4
                      rateeId: 1
                      tags: ["SKILL"]
                      comment: null
                      createdAt: "2026-05-15T20:15:00"
                  nextCursor: 87

  /api/members/{memberId}/compliments/summary:
    get:
      tags: [칭찬]
      summary: 회원 칭찬 누적 카운트 (프로필용)
      description: 태그별 칭찬 누적 횟수를 조회합니다. `member_compliment_summary` 테이블에서 단건 조회합니다.
      parameters:
        - name: memberId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                success: true
                message: "칭찬 통계 조회 성공"
                data:
                  memberId: 1
                  totalCount: 35
                  tagCounts:
                    MANNERS: 12
                    SKILL: 8
                    PUNCTUAL: 7
                    PASSIONATE: 5
                    MOOD_MAKER: 3

  /api/matches/{matchId}/compliments/me:
    get:
      tags: [칭찬]
      summary: 특정 경기에서 내가 한/받은 칭찬 조회
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                success: true
                message: "경기 칭찬 조회 성공"
                data:
                  given:
                    - complimentId: 88
                      matchId: 12
                      raterId: 1
                      rateeId: 5
                      tags: ["MANNERS"]
                      comment: "재밌었어요"
                      createdAt: "2026-05-17T19:30:00"
                  received:
                    - complimentId: 90
                      matchId: 12
                      raterId: 4
                      rateeId: 1
                      tags: ["SKILL", "PASSIONATE"]
                      comment: null
                      createdAt: "2026-05-17T19:35:00"

# ============================================================
# Components
# ============================================================
components:

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "카카오 로그인 후 발급받은 accessToken"

  responses:
    Unauthorized:
      description: 인증 실패 (토큰 없음 또는 만료)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: "인증이 필요합니다."
            data: null

    MatchNotFound:
      description: 존재하지 않거나 삭제된 경기
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            notFound:
              value: { success: false, message: "존재하지 않는 경기입니다.", data: null }
            deleted:
              value: { success: false, message: "이미 삭제된 경기입니다.", data: null }

  schemas:

    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          nullable: true

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        data:
          nullable: true
          example: null

    SignUpCompleteRequest:
      type: object
      required: [nickname, gender, age, favoriteSports]
      properties:
        nickname:
          type: string
          minLength: 2
          maxLength: 10
          description: "닉네임 (2~10자)"
        gender:
          type: string
          enum: [M, F]
        age:
          type: integer
        address:
          type: string
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        favoriteSports:
          type: array
          items:
            type: string
            enum: [SOCCER, BASKETBALL, RUNNING, BADMINTON]
          description: "즐겨하는 종목 (1개 이상)"
        skillLevel:
          type: string
          enum: [BEGINNER, INTERMEDIATE, ADVANCED]
        preferredPosition:
          type: string

    UpdateProfileRequest:
      type: object
      description: 변경할 필드만 포함. null이면 해당 필드 유지.
      properties:
        nickname:
          type: string
          minLength: 2
          maxLength: 10
          nullable: true
        address:
          type: string
          nullable: true
        latitude:
          type: number
          format: double
          nullable: true
        longitude:
          type: number
          format: double
          nullable: true
        favoriteSports:
          type: array
          items:
            type: string
            enum: [SOCCER, BASKETBALL, RUNNING, BADMINTON]
          nullable: true
          description: "null이면 유지, 빈 배열이면 전체 삭제"

    MatchCreateRequest:
      type: object
      required: [title, sportType, matchDate, latitude, longitude, maxPlayers]
      properties:
        title:
          type: string
        sportType:
          type: string
          enum: [SOCCER, BASKETBALL, RUNNING, BADMINTON]
        matchDate:
          type: string
          format: date-time
          description: "현재 시각 이후여야 함 (@FutureOrPresent)"
        locationName:
          type: string
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        address:
          type: string
        maxPlayers:
          type: integer
          minimum: 1
        gender:
          type: string
          enum: [M, F]
          nullable: true
          description: "null이면 무관"
        ageRange:
          type: integer
          nullable: true
          description: "연령대 (예: 20 = 20대). null이면 무관"
        skillLevel:
          type: string
          enum: [BEGINNER, INTERMEDIATE, ADVANCED]
          nullable: true
        entryFee:
          type: integer
          minimum: 0
          nullable: true
          description: "참가비. null이면 0으로 처리"
        description:
          type: string
          nullable: true

    MatchUpdateRequest:
      type: object
      description: 변경할 필드만 포함. null이면 해당 필드 유지.
      properties:
        title:
          type: string
          nullable: true
        matchDate:
          type: string
          format: date-time
          nullable: true
          description: "현재 시각 이후여야 함 (@FutureOrPresent)"
        maxPlayers:
          type: integer
          minimum: 1
          nullable: true
          description: "currentPlayers 이상이어야 함"
        entryFee:
          type: integer
          minimum: 0
          nullable: true
        description:
          type: string
          nullable: true

    RandomMatchRequest:
      type: object
      required: [latitude, longitude, sportType]
      properties:
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        radius:
          type: number
          format: double
          default: 5.0
          description: "검색 반경 km"
        sportType:
          type: string
          enum: [SOCCER, BASKETBALL, RUNNING, BADMINTON]
        date:
          type: string
          format: date
          nullable: true
        maxFee:
          type: integer
          nullable: true
          description: "최대 참가비"
        skillLevel:
          type: string
          enum: [BEGINNER, INTERMEDIATE, ADVANCED]
          nullable: true
        gender:
          type: string
          enum: [M, F]
          nullable: true
        ageRange:
          type: integer
          nullable: true

    DeviceTokenRequest:
      type: object
      required: [token, platform]
      properties:
        token:
          type: string
          description: FCM에서 발급받은 푸시 토큰
        platform:
          type: string
          enum: [ANDROID, IOS, WEB]

    ComplimentSubmitItem:
      type: object
      required: [rateeId, tags]
      properties:
        rateeId:
          type: integer
          format: int64
        tags:
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          items:
            type: string
            enum: [MANNERS, SKILL, PUNCTUAL, PASSIONATE, MOOD_MAKER]
        comment:
          type: string
          maxLength: 200
          nullable: true

    ComplimentBulkRequest:
      type: object
      required: [compliments]
      properties:
        compliments:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ComplimentSubmitItem'
