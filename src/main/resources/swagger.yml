              example: { success: false, message: "접근 권한이 없습니다.", data: null }
        '404':
          $ref: '#/components/responses/MatchNotFound'

    delete:
      tags: [경기]
      summary: 경기 삭제 (주최자 전용)
      description: |
        경기를 DELETED 상태로 변경합니다(소프트 삭제).
        삭제 후 해당 경기는 목록 및 상세 조회에서 제외됩니다.
      parameters:
