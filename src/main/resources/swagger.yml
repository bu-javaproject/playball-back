  /api/matching/local:
    get:
      tags: [매칭]
      summary: 지역 매칭 - 주변 경기 검색
      description: |
        **플로우차트: 8. 로컬 매칭**
        **와이어프레임: 지역 매칭 메인 + 상세 필터**

        현재 위치 기반 주변 경기를 검색합니다. 비로그인 사용자도 사용 가능합니다.
        지도에 표시할 경기 목록을 반환합니다.

        **상세 필터 항목 (와이어프레임 기준):**
        - 종목: 전체, 축구, 농구, 달리기, 배드민턴, +더보기
        - 날짜: 오늘, 내일, 이번 주, 날짜 선택
        - 시간: 오전, 오후
        - 실력: 초급, 중급, 고급
        - 참가비: 무료, 1만원 이하, 상관없음
      security: []
      parameters:
        - name: latitude
          in: query
          required: true
          description: 검색 기준 위도
          schema:
            type: number
            format: double
          example: 37.6394
        - name: longitude
          in: query
          required: true
          description: 검색 기준 경도
          schema:
            type: number
            format: double
          example: 127.0722
        - name: radius
          in: query
          description: "검색 반경 km (기본 5)"
          schema:
            type: number
            default: 5.0
        - name: sportType
          in: query
          description: "종목 (SOCCER, BASKETBALL, RUNNING, BADMINTON 등). 생략 시 전체"
          schema:
            type: string
        - name: date
          in: query
          description: "TODAY / TOMORROW / THIS_WEEK / yyyy-MM-dd"
          schema:
            type: string
          example: "TODAY"
        - name: timeSlot
          in: query
          description: "AM(오전) / PM(오후)"
          schema:
            type: string
            enum: [AM, PM]
        - name: skillLevel
          in: query
          description: "BEGINNER(초급) / INTERMEDIATE(중급) / ADVANCED(고급)"
          schema:
            type: string
        - name: feeType
          in: query
          description: "FREE(무료) / UNDER_10000(1만원 이하) / ANY(상관없음)"
          schema:
            type: string
            enum: [FREE, UNDER_10000, ANY]
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: 검색 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                success: true
                message: "성공"
                data:
                  totalCount: 5
                  matches:
                    - matchId: 1
                      title: "백석대 중앙운동장"
                      sportType: "SOCCER"
                      matchDate: "2026-04-30T19:00:00"
                      locationName: "백석대 중앙운동장"
                      latitude: 37.6400
                      longitude: 127.0730
                      maxPlayers: 10
                      currentPlayers: 7
                      skillLevel: "INTERMEDIATE"
                      entryFee: 0
                      distance: 0.5
                      status: "OPEN"
                    - matchId: 2
                      title: "백석대 버스정류장 옆"
                      sportType: "BASKETBALL"
                      matchDate: "2026-04-30T19:00:00"
                      locationName: "백석대 버스정류장 옆"
