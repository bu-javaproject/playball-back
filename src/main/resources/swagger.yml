  /api/matching/random:
    post:
      tags: [매칭]
      summary: 랜덤 매칭 요청
      description: |
        **플로우차트: 9. 랜덤 매칭**
        **와이어프레임: 랜덤 매칭 입력 화면**

        조건을 입력하면 시스템이 적합한 경기를 찾습니다.

        **입력 항목 (와이어프레임 순서):**
        1. 위치
        2. 날짜
        3. 종목
        4. 선호 포지션 및 역할 (예: ST)
        5. 성별 (혼성 경기 / 남성 경기 등)
        6. 나이대 (예: 21)
        7. 실력 (별점 5점 만점)
        8. 매칭 비용 (가격대)
        → "매칭" 버튼

        **결과 화면:**
        - 탐색 중: "주변 경기를 찾고 있어요" + 취소 버튼
        - 성공: "경기 발견" 화면 → 수락/거절 버튼
        - 실패: "조건에 맞는 경기가 없어요" → 조건 다시 설정 / 경기 직접 만들기
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RandomMatchRequest'
            example:
              latitude: 37.6394
              longitude: 127.0722
              address: "서울시 노원구 신부동"
              date: "2026-04-30"
              sportType: "SOCCER"
              preferredPosition: "ST"
              gender: "M"
              ageRange: 21
              skillLevel: 3
              maxFee: 10000
      responses:
        '200':
          description: 매칭 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              examples:
                found:
                  summary: 매칭 성공 → 경기 발견
                  value:
                    success: true
                    message: "매칭 성공"
                    data:
                      matched: true
                      match:
                        matchId: 3
                        title: "백석대 축구 내기"
                        sportType: "SOCCER"
                        matchDate: "2026-04-30T19:00:00"
                        locationName: "서울 목동운동장"
                        latitude: 37.5283
                        longitude: 126.8755
                        maxPlayers: 10
                        currentPlayers: 7
                        distance: 2.3
                        creatorNickname: "홍길동"
                notfound:
                  summary: 매칭 실패 → 조건에 맞는 경기 없음
                  value:
                    success: true
                    message: "조건에 맞는 경기가 없어요"
                    data:
                      matched: false
                      match: null

  /api/matching/random/accept:
    post:
      tags: [매칭]
      summary: 랜덤 매칭 수락
      description: |
        **와이어프레임: 경기 발견 화면 → "수락" 버튼**
        랜덤 매칭으로 찾은 경기에 참가합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [matchId]
              properties:
                matchId:
                  type: integer
                  format: int64
            example:
              matchId: 3
      responses:
        '200':
          description: 참가 신청 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                success: true
                message: "참가 신청이 완료되었습니다"
                data:
                  matchId: 3
                  matchTitle: "백석대 축구 내기"
                  status: "PENDING"

  /api/matching/random/reject:
    post:
      tags: [매칭]
      summary: 랜덤 매칭 거절
      description: |
        **와이어프레임: 경기 발견 화면 → "거절" 버튼**
        매칭된 경기를 거절합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [matchId]
              properties:
                matchId:
                  type: integer
                  format: int64
            example:
              matchId: 3
      responses:
        '200':
          description: 거절 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                success: true
                message: "매칭이 거절되었습니다"
                data: null

  # ──────────────────────────────────────────────
  # 알림
  # ──────────────────────────────────────────────

  /api/notifications:
    get:
      tags: [알림]
      summary: 내 알림 목록 조회 (Cursor 페이지네이션)
      description: |
        무한 스크롤 형태. 첫 호출은 cursor 생략, 응답의 `nextCursor`를 다음 호출에 전달.
        `nextCursor`가 null이면 더 이상 데이터 없음.

        **알림 타입 (notice_type):**
        - `MATCH_FOUND`: 랜덤 매칭 성사 / 신청 수락
        - `APPLICATION_REJECTED`: 신청 거절
        - `MATCH_REMINDER`: 경기 시작 1시간 전 리마인더
        - `MATCH_CANCELLED`: 경기 취소
        - `RATING_REQUEST`: 경기 종료 → 칭찬 요청
        - `SYSTEM_NOTICE`: 시스템 공지
      parameters:
        - name: cursor
          in: query
          description: 이전 응답의 nextCursor 값. 첫 호출은 생략
          schema:
            type: integer
            format: int64
        - name: size
          in: query
          schema:
            type: integer
            default: 20
        - name: onlyUnread
          in: query
          description: true면 안 읽은 알림만 조회
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                success: true
                message: "성공"
                data:
                  items:
                    - notificationId: 145
                      noticeType: "MATCH_FOUND"
                      title: "매칭 성사!"
                      content: "백석대 컴공 내기 매칭이 성사되었습니다."
                      isRead: false
                      targetType: "MATCH"
                      targetId: 12
                      createdAt: "2026-05-04T19:00:00"
                    - notificationId: 144
                      noticeType: "MATCH_REMINDER"
                      title: "경기 임박"
                      content: "내일 오후 7시 '백석대 축구' 경기가 있습니다"
                      isRead: false
                      targetType: "MATCH"
                      targetId: 1
                      createdAt: "2026-05-04T17:00:00"
                  nextCursor: 144

  /api/notifications/{notificationId}/read:
    patch:
      tags: [알림]
      summary: 알림 읽음 처리
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 읽음 처리 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                success: true
                message: "성공"
                data: null

  /api/notifications/read-all:
    patch:
      tags: [알림]
      summary: 전체 알림 읽음 처리
      responses:
        '200':
          description: 전체 읽음 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                success: true
                message: "모든 알림을 읽었습니다"
                data: null

  /api/notifications/settings:
    get:
      tags: [알림]
      summary: 알림 설정 조회
      description: 현재 알림 수신 설정을 조회합니다.
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                success: true
                message: "성공"
                data:
                  enabled: true
                  updatedAt: "2026-05-04T18:30:00"

    patch:
      tags: [알림]
      summary: 알림 ON/OFF 토글
      description: 전체 알림 수신을 켜거나 끕니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled:
                  type: boolean
            example:
              enabled: false
      responses:
        '200':
          description: 설정 변경 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                success: true
                message: "알림 설정이 변경되었습니다"
                data:
                  enabled: false
                  updatedAt: "2026-05-04T19:01:00"

  /api/devices/token:
    post:
      tags: [ 알림 ]
      summary: FCM 푸시 토큰 등록/갱신
      description: |
        모바일 앱이 FCM에서 발급받은 푸시 토큰을 서버에 등록합니다.
        앱 실행 시 매번 호출 (FCM 토큰은 앱 재설치 / 로그아웃 등으로 변경 가능).
        같은 토큰이 이미 다른 사용자에게 등록돼 있으면 새 사용자로 갱신.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceTokenRequest'
            example:
              token: "fGcm_long_token_string..."
              platform: "ANDROID"
      responses:
        '200':
          description: 등록 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                success: true
                message: "기기 토큰이 등록되었습니다"
                data: null

    delete:
      tags: [ 알림 ]
      summary: FCM 푸시 토큰 삭제
      description: |
        로그아웃 시 호출. 안 호출하면 다음 사용자의 푸시가 이 기기로 갈 수 있음.
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 삭제 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                success: true
                message: "기기 토큰이 삭제되었습니다"
                data: null



  # ──────────────────────────────────────────────
  # 칭찬
  # ──────────────────────────────────────────────

  /api/matches/{matchId}/compliments:
    post:
      tags: [칭찬]
      summary: 경기 후 같이 뛴 사람 칭찬 (Bulk)
      description: |
        경기 종료 후 같이 뛴 참가자들을 한 번에 칭찬합니다.
        
        **칭찬 태그 (multi-select):**
        - `MANNERS`: 매너 좋아요
        - `SKILL`: 실력 좋아요
        - `PUNCTUAL`: 시간 약속 잘 지켜요
        - `PASSIONATE`: 열정적이에요
        - `MOOD_MAKER`: 분위기 메이커
        
        **검증 규칙:**
        - 매치 상태가 `CLOSED` 여야 함 (진행 전 평가 불가)
        - 매치 종료 후 7일 이내만 가능
        - 호출자(rater)와 각 ratee 모두 그 매치에 참여했어야 함
        - 자기 자신 평가 불가 (rateeId ≠ raterId)
        - 같은 batch에서 같은 rateeId 중복 불가
        - 각 칭찬당 tag 1~5개 (중복 X)
        - 이미 그 사람을 그 경기에서 칭찬했으면 거부
        
        **트랜잭션:** 1명이라도 검증 실패 시 전체 롤백.
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComplimentBulkRequest'
            example:
              compliments:
                - rateeId: 5
                  tags: [ "MANNERS", "PUNCTUAL" ]
                  comment: "오늘 정말 즐거웠습니다"
                - rateeId: 7
                  tags: [ "SKILL" ]
                  comment: null
      responses:
        '201':
          description: 칭찬 등록 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                success: true
                message: "2명에게 칭찬을 보냈습니다"
                data:
                  created: 2
        '400':
          description: 검증 실패 (경기 미종료 / 7일 경과 / 비참가자 / 중복 등)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notClosed:
                  summary: 매치가 아직 종료되지 않음
                  value:
                    success: false
                    message: "경기 종료 후 칭찬할 수 있습니다"
                    data: null
                expired:
                  summary: 7일 경과
                  value:
                    success: false
                    message: "칭찬 가능 기간(7일)이 지났습니다"
                    data: null
                notParticipant:
                  summary: 참가자 아님
                  value:
                    success: false
                    message: "해당 경기 참가자만 칭찬할 수 있습니다"
                    data: null
                duplicate:
                  summary: 이미 칭찬함
                  value:
                    success: false
                    message: "이미 칭찬한 참가자가 포함되어 있습니다"
                    data: null
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/members/{memberId}/compliments:
    get:
      tags: [ 칭찬 ]
      summary: 받은 칭찬 목록 조회 (Cursor 페이지네이션)
      description: |
        **와이어프레임: 다른 유저 프로필 → 받은 칭찬**
        
        특정 회원이 받은 칭찬을 최신순으로 조회.
      parameters:
        - name: memberId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: cursor
          in: query
          schema:
            type: integer
            format: int64
        - name: size
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                success: true
                message: "성공"
                data:
                  items:
                    - complimentId: 88
                      matchId: 12
                      matchTitle: "백석대 축구 내기"
                      raterNickname: "홍길동"
                      tags: [ "MANNERS", "PUNCTUAL" ]
                      comment: "오늘 정말 즐거웠습니다"
                      createdAt: "2026-05-04T19:30:00"
                    - complimentId: 87
                      matchId: 10
                      matchTitle: "농구 3:3"
                      raterNickname: "김철수"
                      tags: [ "SKILL" ]
                      comment: null
                      createdAt: "2026-05-03T20:15:00"
                  nextCursor: 87

  /api/members/{memberId}/compliments/summary:
    get:
      tags: [ 칭찬 ]
      summary: 받은 칭찬 누적 카운트 (프로필용)
      description: |
        **와이어프레임: 프로필 화면 → 칭찬 배지**
        
        회원이 받은 칭찬을 태그별로 집계. `member_compliment_summary` 테이블에서 1회 조회.
      parameters:
        - name: memberId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                success: true
                message: "성공"
                data:
                  totalCount: 35
                  tags:
                    - tag: "MANNERS"
                      count: 12
                    - tag: "SKILL"
                      count: 8
                    - tag: "PUNCTUAL"
                      count: 7
                    - tag: "PASSIONATE"
                      count: 5
                    - tag: "MOOD_MAKER"
                      count: 3

  /api/matches/{matchId}/compliments/me:
    get:
      tags: [ 칭찬 ]
      summary: 이 경기에서 내가 한/받은 칭찬 조회
      description: |
        **와이어프레임: 경기 종료 후 칭찬 화면**
        
        경기 단위로 본인이 평가한 사람들 + 평가받은 사람들을 한 번에 조회.
        - `given`: 내가 다른 참가자에게 한 칭찬
        - `received`: 다른 참가자가 나에게 한 칭찬
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                success: true
                message: "성공"
                data:
                  given:
                    - complimentId: 88
                      rateeId: 5
                      rateeNickname: "박영희"
                      tags: [ "MANNERS" ]
                      comment: "재밌었어요"
                      createdAt: "2026-05-04T19:30:00"
                  received:
                    - complimentId: 90
                      raterNickname: "김철수"
                      tags: [ "SKILL", "PASSIONATE" ]
                      comment: null
                      createdAt: "2026-05-04T19:35:00"

# ============================================================
# Components
# ============================================================
components:

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "카카오 로그인 후 발급받은 accessToken"

  schemas:

    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          nullable: true

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        data:
          nullable: true
          example: null

    SignUpCompleteRequest:
      type: object
      required: [nickname, gender, age, favoriteSports]
      properties:
        nickname:
          type: string
          minLength: 2
          maxLength: 10
          description: "닉네임 (2~10자)"
        gender:
          type: string
          enum: [M, F]
          description: "성별"
        age:
          type: integer
          description: "나이"
        address:
          type: string
          description: "지역"
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        favoriteSports:
          type: array
          items:
            type: string
          description: "즐겨하는 종목 (복수 선택)"
          example: ["SOCCER", "BASKETBALL", "RUNNING"]
        skillLevel:
          type: string
          enum: [BEGINNER, INTERMEDIATE, ADVANCED]
          description: "실력 수준"
        preferredPosition:
          type: string
          description: "선호 포지션"

    ProfileEditRequest:
      type: object
      description: 변경할 필드만 포함
      properties:
        nickname:
          type: string
        profileImage:
          type: string
        address:
          type: string
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        favoriteSports:
          type: array
          items:
            type: string
        skillLevel:
          type: string
          enum: [BEGINNER, INTERMEDIATE, ADVANCED]
        preferredPosition:
          type: string

    MatchCreateRequest:
      type: object
      required: [title, sportType, matchDate, latitude, longitude, maxPlayers]
      properties:
        title:
          type: string
          description: "경기 제목"
        sportType:
          type: string
          description: "종목"
        matchDate:
          type: string
          format: date-time
          description: "경기 날짜/시간"
        locationName:
          type: string
          description: "장소명"
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        address:
          type: string
        maxPlayers:
          type: integer
          description: "최대 인원"
        skillLevel:
          type: string
          enum: [BEGINNER, INTERMEDIATE, ADVANCED]
        entryFee:
          type: integer
          description: "참가비 (0이면 무료)"
          default: 0
        description:
          type: string
          description: "공지 메시지"

    MatchUpdateRequest:
      type: object
      description: 변경할 필드만 포함
      properties:
        title:
          type: string
        matchDate:
          type: string
          format: date-time
        maxPlayers:
          type: integer
        entryFee:
          type: integer
        description:
          type: string
          description: "공지 메시지"

    DeviceTokenRequest:
      type: object
      required: [ token, platform ]
      properties:
        token:
          type: string
          description: FCM에서 발급받은 푸시 토큰
        platform:
          type: string
          enum: [ ANDROID, IOS, WEB ]
          description: 기기 플랫폼

    ComplimentSubmitItem:
      type: object
      required: [ rateeId, tags ]
      properties:
        rateeId:
          type: integer
          format: int64
          description: 칭찬할 대상 회원 ID
        tags:
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          items:
            type: string
            enum: [ MANNERS, SKILL, PUNCTUAL, PASSIONATE, MOOD_MAKER ]
          description: 칭찬 태그 (1~5개, 중복 X)
        comment:
          type: string
          maxLength: 200
          nullable: true
          description: 한마디 코멘트 (선택)

    ComplimentBulkRequest:
      type: object
      required: [ compliments ]
      properties:
        compliments:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ComplimentSubmitItem'
          description: 한 경기에서 여러 명 동시 칭찬

    RandomMatchRequest:
      type: object
      required: [latitude, longitude, sportType]
      properties:
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        address:
          type: string
        date:
          type: string
          format: date
        sportType:
          type: string
        preferredPosition:
          type: string
        gender:
          type: string
          enum: [M, F]
        ageRange:
          type: integer
          description: "연령대"
        skillLevel:
          type: integer
          minimum: 1
          maximum: 5
          description: "실력 (별 1~5개)"
        maxFee:
          type: integer
          description: "최대 참가비"

  responses:
    Unauthorized:
      description: 인증 실패
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: "인증이 필요합니다"
            data: null
  
