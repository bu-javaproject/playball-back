  # ──────────────────────────────────────────────
  # 매칭 (참가·취소·랜덤)
  # ──────────────────────────────────────────────

  /api/matches/{matchId}/join:
    post:
      tags: [매칭]
      summary: 경기 참가
      description: |
        경기에 참가를 신청합니다. 참가 즉시 APPROVED 상태가 됩니다.

        **검증 순서:**
        1. 경기 존재 여부 확인 → 없으면 404
        2. DELETED 상태 확인 → 삭제된 경기면 404
        3. 인원 초과 확인 → 꽉 찼으면 409
        4. 이미 참가 여부 확인(PENDING or APPROVED) → 409
        5. 참가 등록 + currentPlayers 증가

        인원이 maxPlayers에 달하면 status가 `CLOSED`로 자동 변경됩니다.
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 참가 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                success: true
                message: "경기 참가 성공"
                data:
                  matchId: 1
                  currentPlayers: 4
                  maxPlayers: 10
                  status: "OPEN"
        '404':
          description: 존재하지 않거나 삭제된 경기
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notFound:
                  value: { success: false, message: "존재하지 않는 경기입니다.", data: null }
                deleted:
                  value: { success: false, message: "이미 삭제된 경기입니다.", data: null }
        '409':
          description: 인원 초과 또는 이미 참가
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                full:
                  summary: 인원 초과
                  value: { success: false, message: "경기 인원이 꽉 찼습니다.", data: null }
                alreadyJoined:
                  summary: 이미 참가
                  value: { success: false, message: "이미 참가한 경기입니다.", data: null }
                conflict:
                  summary: 동시 참가 충돌 (낙관적 락)
                  value: { success: false, message: "다른 사용자가 동시에 참가 중입니다. 다시 시도해주세요.", data: null }

    delete:
      tags: [매칭]
      summary: 경기 참가 취소
      description: |
        내가 APPROVED 상태로 참가 중인 경기에서 나갑니다.

        **검증:**
        - DELETED 경기면 404
        - APPROVED 상태 참가 기록이 없으면 400 (`NOT_JOINED`)
        - 성공 시 참가 기록을 CANCELLED로 변경 + currentPlayers 감소
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 취소 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                success: true
                message: "경기 참가 취소 성공"
                data:
                  matchId: 1
                  currentPlayers: 3
                  maxPlayers: 10
                  status: "OPEN"
        '400':
          description: 참가하지 않은 경기
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example: { success: false, message: "참가하지 않은 경기입니다.", data: null }
        '404':
          $ref: '#/components/responses/MatchNotFound'

  /api/matches/random:
    post:
      tags: [매칭]
      summary: 랜덤 매칭
      description: |
        조건에 맞는 경기를 랜덤으로 1개 추천합니다.

        **필터 조건 (모두 선택):**
        - 위치 기반 반경 내
        - OPEN 상태 + currentPlayers < maxPlayers
        - 본인이 이미 참가(PENDING or APPROVED)한 경기 제외
        - sportType, date, maxFee, skillLevel, gender, ageRange 필터

        조건에 맞는 경기가 없으면 404를 반환합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RandomMatchRequest'
            example:
              latitude: 37.6394
              longitude: 127.0722
              radius: 5.0
              sportType: "SOCCER"
              date: "2026-05-30"
              maxFee: 10000
              skillLevel: "INTERMEDIATE"
              gender: "M"
              ageRange: 20
      responses:
        '200':
          description: 매칭 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                success: true
                message: "랜덤 매칭 성공"
                data:
                  matchId: 3
                  title: "백석대 축구 내기"
                  sportType: "SOCCER"
                  matchDate: "2026-05-30T19:00:00"
                  locationName: "서울 목동운동장"
                  entryFee: 0
                  currentPlayers: 7
                  maxPlayers: 10
                  distance: 2.3
        '404':
          description: 조건에 맞는 경기 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example: { success: false, message: "존재하지 않는 경기입니다.", data: null }

