  /api/matches/{matchId}/join:
    post:
      tags: [참가자]
      summary: 참가 신청
      description: |
        **와이어프레임: "참여 신청하기" 파란 버튼**
        경기에 참가를 신청합니다.

        **결과 화면:**
        - 성공 → "참가 신청 완료!" 화면 (경기 상세 보기 / 홈으로 버튼)
        - 인원 초과 → 대기 목록에 등록
        - 이미 참가 → 409 에러
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                position:
                  type: string
                  description: 희망 포지션
            example:
              position: "MF"
      responses:
        '201':
          description: 참가 신청 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                success: true
                message: "참가 신청이 완료되었습니다"
                data:
                  participantId: 10
                  matchId: 1
                  matchTitle: "백석대 컴공 축구 내기 할 사람"
                  matchDate: "2026-04-30T19:00:00"
                  locationName: "서울 목동운동장"
                  status: "PENDING"
        '409':
          description: 이미 참가 또는 인원 초과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                already:
                  summary: 이미 참가
                  value:
                    success: false
                    message: "이미 참가한 경기입니다"
                    data: null
                full:
                  summary: 인원 초과
                  value:
                    success: false
                    message: "경기 인원이 꽉 찼습니다"
                    data: null

