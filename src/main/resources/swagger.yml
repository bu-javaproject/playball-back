                      messageType: "TEXT"
                      sentAt: "2026-04-26T18:00:00"
                    - messageId: 99
                      senderId: 2
                      senderNickname: "김철수"
                      senderProfileImage: null
                      content: "네 알겠습니다!"
                      messageType: "TEXT"
                      sentAt: "2026-04-26T17:58:00"

